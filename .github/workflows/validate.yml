# ╔══════════════════════════════════════╗
# ║ Automation.Workflows Validate v1.1.0 ║
# ╚══════════════════════════════════════╝
# Reusable validation workflow. Callers provide the consumer repo's own checkout;
# this workflow additionally checks out Automation.Workflows itself (public, no token needed)
# to get at the shared scripts, then reads the consumer's .github/ci-config.json.
name: Reusable Validate

on:
  workflow_call:
    inputs:
      environment:
        description: 'The runner (operating system) that will process the jobs. See: https://docs.github.com/en/actions/using-jobs/choosing-the-runner-for-a-job#choosing-github-hosted-runners.'
        default: 'ubuntu-latest'
        required: false
        type: string
      dotnet-version:
        type: string
        default: '10.0.x'
      config-path:
        description: 'Path to ci-config.json, relative to the consumer repo root.'
        type: string
        default: '.github/ci-config.json'
      tools-ref:
        description: 'Ref of Phoenix/Automation.Workflows to check out scripts from.'
        type: string
        #! Always switch to a fixed tag (e.g. 'v1') once any development is finished and the new version is to be published.
        default: 'v1'
        #default: 'development'

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

permissions:
  contents: read
  checks: write

# Cancel an older, still-running validation for the same repository/workflow/ref rather than queuing behind it. Different branches validate in parallel because the group is scoped to the github.ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  validate:
    name: Validate repository
    runs-on: ${{ inputs.environment }}
    steps:

      - name: <Setup> Checkout consumer repository
        uses: actions/checkout@v7

      - name: <Setup> Checkout Automation.Workflows scripts
        uses: actions/checkout@v7
        with:
          repository: LittleGitPhoenix/Automation.Workflows
          ref: ${{ inputs.tools-ref }}
          path: _tools

      - name: <Setup> Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: <Test> Check project versions
        shell: pwsh
        run: _tools/scripts/Test-ProjectVersions.ps1 -WorkspaceRoot "$pwd" -ConfigPath "${{ inputs.config-path }}" -SummaryFile "$Env:RUNNER_TEMP/ci-summary.md"

      - name: <Test> Check for prerelease packages
        shell: pwsh
        run: _tools/scripts/Test-PackageVersions.ps1 -WorkspaceRoot "$pwd" -ConfigPath "${{ inputs.config-path }}" -SummaryFile "$Env:RUNNER_TEMP/ci-summary.md"

      - name: <Test> Check changelog versions
        shell: pwsh
        run: _tools/scripts/Test-ChangelogVersions.ps1 -WorkspaceRoot "$pwd" -ConfigPath "${{ inputs.config-path }}" -SummaryFile "$Env:RUNNER_TEMP/ci-summary.md"

      - name: <Build> Build solution
        shell: pwsh
        run: _tools/scripts/Invoke-Build.ps1 -WorkspaceRoot "$pwd" -ConfigPath "${{ inputs.config-path }}"

      - name: <Test> Run tests with coverage
        id: run-tests
        shell: pwsh
        run: _tools/scripts/Invoke-Tests.ps1 -WorkspaceRoot "$pwd" -ConfigPath "${{ inputs.config-path }}" -SummaryFile "$Env:RUNNER_TEMP/ci-summary.md"

      - name: <Summary> Write step summary
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/ci-summary.md" ]; then
            cat "$RUNNER_TEMP/ci-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: <Test> Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Unit Tests
          path: '**/TestResults/*.test.result.xml'
          reporter: dotnet-nunit
          fail-on-empty: 'false'
          fail-on-error: 'false'